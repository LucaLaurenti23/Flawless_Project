<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda · Flawless Project</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  body { overflow-y: auto; }
  .pagina { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  .intestazione { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .intestazione h1 { margin: 0; font-size: 26px; }
  .riassunto { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .sezione { margin-top: 26px; }
  .sezione > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--debole); margin: 0 0 10px; }
  .doc { background: var(--pannello); border: 1px solid var(--bordo); border-radius: var(--raggio); margin-bottom: 14px; overflow: hidden; }
  .doc header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bordo); }
  .doc header b { font-size: 15px; }
  .brano { padding: 12px 16px; border-left: 3px solid var(--bordeaux); margin: 12px 16px; background: var(--scheda); line-height: 1.6; }
  .brano .dove { display: block; font-size: 10.5px; color: var(--debole); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .avviso { background: rgba(224, 178, 92, .1); border: 1px solid rgba(224, 178, 92, .4); color: var(--attenzione); border-radius: var(--raggio); padding: 12px 16px; margin-bottom: 14px; }
  .azioni { margin-left: auto; display: flex; gap: 8px; }
</style>
</head>
<body class="scheda">
<header class="testata" style="padding-bottom:14px">
  <div class="riga-alta">
    <a class="marchio" href="index.html" style="color:inherit;text-decoration:none">
      <div class="logo" id="logo"></div>
      <div>Flawless Project<small id="tipo-pagina">Scheda</small></div>
    </a>
    <div class="spazio"></div>
    <button class="tema-btn" id="tema" title="Cambia tema: chiaro (carta) o scuro">
      <span class="per-scuro"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Scuro</span>
      <span class="per-chiaro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Chiaro</span>
    </button>
  </div>
</header>
<div class="pagina" id="pagina" data-linguetta="Fascicolo · Studio legale"><div class="vuoto">Carico…</div></div>

<script src="comune.js"></script>
<script>
// $, esc, api, evidenzia, pagina... vengono da comune.js
$('#logo').innerHTML = ICONE.logo;
const parametri = new URLSearchParams(location.search);

async function paginaDocumento(id, paginaScelta, termini) {
  const d = await api(`/documents/${id}`);
  const dati = await api(`/documents/${id}/extraction`);
  $('#tipo-pagina').textContent = 'Documento';
  document.title = `${d.filename} · Flawless Project`;
  const tipo = dati.rows.find((r) => r.categoria === 'Tipo di documento')?.valore;
  const numerate = d.pages.filter((p) => p.page).length;
  $('#pagina').innerHTML = `
    <div class="intestazione"><div><h1>${esc(d.filename)}</h1>
      <div class="riassunto">${tipo ? `<span class="etichetta bordeaux">${esc(tipo)}</span>` : ''}
        ${numerate ? `<span class="etichetta">${numerate} pagine</span>` : ''}
        <span class="etichetta">caricato ${esc(d.created_at.slice(0, 10).split('-').reverse().join('/'))}</span>
        <span class="etichetta">dati: ${esc(dati.status)}</span></div></div>
      <div class="azioni"><a class="btn-piccolo grigio" href="strumenti.html?t=riassunto&doc=${d.id}">Riassumi</a>
        <a class="btn-piccolo grigio" href="strumenti.html?t=estrazione&doc=${d.id}">Dati</a></div></div>
    ${d.warning ? `<div class="avviso">${esc(d.warning)}</div>` : ''}
    <article class="doc">${d.pages.map((p) => `<div class="pagina-doc ${p.page && p.page === paginaScelta ? 'evidenziata' : ''}" id="p${p.page ?? 0}">
      ${p.page ? `<span class="num-pagina">Pagina ${p.page}</span>` : ''}${evidenzia(p.text, termini)}</div>`).join('')
      || '<div class="vuoto">Il documento non contiene testo.</div>'}</article>`;
  if (paginaScelta) document.getElementById(`p${paginaScelta}`)?.scrollIntoView({ block: 'start' });
}

async function paginaNorma(id) {
  const a = await api(`/normativa/norme/${id}`);
  $('#tipo-pagina').textContent = 'Testo di legge';
  document.title = `${a.etichetta} · Flawless Project`;
  $('#pagina').dataset.linguetta = `${a.fonte} · testo ufficiale vigente`;
  const vigente = (a.vigente_al || '').split('-').reverse().join('/');
  $('#pagina').innerHTML = `
    <div class="intestazione"><div><h1>${esc(a.etichetta)}</h1>
      ${a.rubrica ? `<div style="font-size:15px;margin-top:4px">${esc(a.rubrica)}</div>` : ''}
      <div class="riassunto"><span class="etichetta bordeaux">${esc(a.titolo_atto)}</span>
        <span class="etichetta">vigente al ${esc(vigente)}</span><span class="etichetta">fonte: ${esc(a.fonte)}</span></div></div>
      <div class="azioni">
        ${a.precedente ? `<a class="btn-piccolo grigio" href="scheda.html?norma=${a.precedente}" title="Articolo precedente">‹ Prec.</a>` : ''}
        ${a.successivo ? `<a class="btn-piccolo grigio" href="scheda.html?norma=${a.successivo}" title="Articolo successivo">Succ. ›</a>` : ''}
        <a class="btn-piccolo" href="${esc(a.url)}" target="_blank" rel="noopener" title="Apri il testo sul sito ufficiale">${ICONE.apri}Fonte ufficiale</a></div></div>
    <article class="doc">${a.text.split('\n').map((riga) => `<div class="pagina-doc" style="border-top:0;padding:6px 18px">${esc(riga)}</div>`).join('')}</article>
    <p class="nota-destra" style="margin:14px 0 0">Testo scaricato da ${esc(a.fonte)} il ${esc(vigente)}. Per atti e scadenze verifica sempre la versione aggiornata sul sito ufficiale.</p>`;
}

async function paginaRicerca(q) {
  const fascicolo = fascicoloSalvato();
  const [r, norme] = await Promise.all([api(`/cases/${fascicolo}/search?q=${encodeURIComponent(q)}`),
    api(`/normativa/cerca?q=${encodeURIComponent(q)}&k=8`).catch(() => ({ risultati: [] }))]);
  $('#tipo-pagina').textContent = 'Ricerca nei documenti e nella normativa';
  document.title = `"${q}" · Flawless Project`;
  const n = r.documenti.reduce((a, d) => a + d.brani.length, 0);
  const sezioneNorme = norme.risultati.length ? `<section class="sezione"><h2>Nella normativa</h2>
    ${norme.risultati.map((f) => `<a class="brano" style="display:block;color:inherit;text-decoration:none" href="scheda.html?norma=${f.norma_id}">
      <span class="dove">${esc(f.etichetta)}${f.rubrica ? ` – ${esc(f.rubrica)}` : ''}</span>${evidenzia(f.text.slice(0, 420), [q])}${f.text.length > 420 ? '…' : ''}</a>`).join('')}
    </section>` : '';
  $('#pagina').innerHTML = `<div class="intestazione"><div><h1>“${esc(q)}”</h1>
      <div class="riassunto"><span class="etichetta bordeaux">${r.documenti.length} documenti</span><span class="etichetta">${n} passaggi</span>
        <span class="etichetta">${norme.risultati.length} articoli di legge</span></div></div></div>
    <section class="sezione"><h2>Nei documenti del fascicolo</h2>
    ${r.documenti.map((d) => `<article class="doc">
      <header><b>${esc(d.filename)}</b><span><span class="etichetta">${d.brani.length} ${d.brani.length === 1 ? 'passaggio' : 'passaggi'}</span>
        <a class="btn-piccolo" href="scheda.html?doc=${d.id}&q=${encodeURIComponent(q)}">${ICONE.apri}Apri</a></span></header>
      ${d.brani.map((b) => `<a class="brano" style="display:block;color:inherit;text-decoration:none" href="scheda.html?doc=${d.id}&p=${b.page ?? ''}&q=${encodeURIComponent(q)}">
        <span class="dove">${esc(pagina(b.page))}</span>${evidenzia(b.testo, [q])}</a>`).join('')}
    </article>`).join('') || `<div class="avviso">Nessun documento del fascicolo contiene «${esc(q)}». La ricerca è testuale: prova una parola più breve o un sinonimo.</div>`}
    </section>${sezioneNorme}`;
}

(async () => {
  try {
    const termini = parametri.get('q') ? [parametri.get('q')] : [];
    if (parametri.get('norma')) await paginaNorma(Number(parametri.get('norma')));
    else if (parametri.get('doc')) await paginaDocumento(Number(parametri.get('doc')), Number(parametri.get('p')) || null, termini);
    else if (parametri.get('q')) await paginaRicerca(parametri.get('q'));
    else $('#pagina').innerHTML = '<div class="vuoto">Niente da mostrare.</div>';
  } catch (err) {
    $('#pagina').innerHTML = `<div class="avviso">${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
